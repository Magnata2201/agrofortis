<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrofortis - Gestão de Usuários</title>
    
    <!-- BLINDAGEM NUCLEAR PARA PÁGINAS PROTEGIDAS -->
    <script>
        function blindagemTotal() {
            const auth = localStorage.getItem('agrofortis_auth');
            const perms = JSON.parse(localStorage.getItem('agrofortis_user_perms') || '{}');
            if (auth !== 'true') {
                document.documentElement.style.display = 'none';
                window.location.replace('index.html');
            } else if (perms.usuarios !== true) {
                document.documentElement.style.display = 'none';
                window.location.replace('sistema.html');
            }
        }
        blindagemTotal();
        setInterval(blindagemTotal, 500);

        window.history.pushState(null, null, window.location.href);
        window.addEventListener('popstate', function () { window.history.go(1); });
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { agro: { 500: '#16a34a', 600: '#15803d', 700: '#115e59' } } } }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center relative font-sans p-4">

    <div class="fixed inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449?q=80&w=1920&auto=format&fit=crop')] bg-cover bg-center">
        <div class="absolute inset-0 bg-green-950/90 backdrop-blur-sm"></div>
    </div>

    <main class="z-10 w-full max-w-4xl flex flex-col items-center">
        <div class="flex items-center gap-3 mb-6">
            <div class="bg-white/10 p-3 rounded-xl border border-white/20 shadow-lg backdrop-blur-md">
                <i class="ph-fill ph-plant text-4xl text-agro-500"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-wide text-white">Agro<span class="text-agro-500">fortis</span></h1>
        </div>

        <div class="bg-white w-full rounded-3xl shadow-2xl p-8 border border-gray-100 relative">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-gray-100 pb-5 mb-6 gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                        <i class="ph-fill ph-users-three text-agro-500"></i> <span id="tituloFormulario">Novo Usuário</span>
                    </h2>
                    <p class="text-gray-500 text-sm mt-1" id="subtituloFormulario">Cadastre operadores e defina suas permissões de acesso.</p>
                </div>
                <button onclick="abrirModalLista()" class="bg-gray-800 hover:bg-agro-600 text-white text-sm font-semibold py-2.5 px-4 rounded-xl flex items-center gap-2 shadow-md">
                    <i class="ph-bold ph-list-dashes text-agro-500"></i> Ver Usuários
                </button>
            </div>

            <form id="formUsuario" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="md:col-span-2">
                    <label class="block text-gray-600 text-sm font-semibold mb-2">Nome Completo</label>
                    <div class="relative">
                        <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                        <input type="text" id="usrNome" placeholder="Ex: João da Silva" class="w-full bg-gray-50 border border-gray-200 text-gray-700 rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-agro-500 font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-600 text-sm font-semibold mb-2">Login / E-mail</label>
                    <div class="relative">
                        <i class="ph ph-envelope-simple absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                        <input type="text" id="usrEmail" placeholder="usuario@agrofortis.com" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-agro-500 font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-600 text-sm font-semibold mb-2">Senha de Acesso</label>
                    <div class="relative">
                        <i class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                        <input type="password" id="usrSenha" placeholder="Nova senha (deixe em branco p/ manter)" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-agro-500 font-medium">
                    </div>
                </div>

                <div class="md:col-span-2 mt-4">
                    <h3 class="text-gray-700 font-bold mb-3 flex items-center gap-2 border-b border-gray-200 pb-2">
                        <i class="ph-fill ph-shield-check text-agro-600"></i> Permissões de Acesso
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-700 hover:text-agro-600">
                            <input type="checkbox" id="permUsuarios" class="w-5 h-5 text-agro-600 rounded focus:ring-agro-500 border-gray-300">
                            Usuários (Admin Master)
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-700 hover:text-agro-600">
                            <input type="checkbox" id="permClientes" class="w-5 h-5 text-agro-600 rounded focus:ring-agro-500 border-gray-300">
                            Acesso a Clientes
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-700 hover:text-agro-600">
                            <input type="checkbox" id="permProdutores" class="w-5 h-5 text-agro-600 rounded focus:ring-agro-500 border-gray-300">
                            Acesso a Produtores
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-700 hover:text-agro-600">
                            <input type="checkbox" id="permCargas" class="w-5 h-5 text-agro-600 rounded focus:ring-agro-500 border-gray-300">
                            Montagem de Cargas
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-700 hover:text-agro-600">
                            <input type="checkbox" id="permDescargas" class="w-5 h-5 text-agro-600 rounded focus:ring-agro-500 border-gray-300">
                            Gestão de Descargas
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-700 hover:text-agro-600">
                            <input type="checkbox" id="permInspecaoQC" class="w-5 h-5 text-agro-600 rounded focus:ring-agro-500 border-gray-300">
                            Inspeção de Qualidade (QC)
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-700 hover:text-agro-600">
                            <input type="checkbox" id="permVendas" class="w-5 h-5 text-agro-600 rounded focus:ring-agro-500 border-gray-300">
                            Painel de Vendas
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-700 hover:text-agro-600">
                            <input type="checkbox" id="permRelatorios" class="w-5 h-5 text-agro-600 rounded focus:ring-agro-500 border-gray-300">
                            Painel de Relatórios
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-gray-700 hover:text-agro-600">
                            <input type="checkbox" id="permBackup" class="w-5 h-5 text-agro-600 rounded focus:ring-agro-500 border-gray-300">
                            Segurança & Backup
                        </label>
                    </div>
                </div>

                <div class="md:col-span-2 flex flex-col-reverse sm:flex-row items-center justify-end gap-3 mt-4 pt-6 border-t border-gray-100">
                    <button type="button" onclick="cancelarEdicao()" class="w-full sm:w-auto text-gray-500 hover:text-gray-700 hover:bg-gray-100 font-semibold py-3 px-6 rounded-xl transition-colors">Cancelar / Limpar</button>
                    <button type="button" id="btnSalvar" class="w-full sm:w-auto bg-agro-600 hover:bg-agro-500 text-white font-bold py-3 px-8 rounded-xl flex items-center justify-center gap-2 shadow-lg">
                        <i class="ph-bold ph-check"></i> <span id="btnSalvarTexto">Salvar Usuário</span>
                    </button>
                </div>
            </form>
        </div>

        <a href="sistema.html" class="mt-6 text-white/80 hover:text-white flex items-center gap-2 text-sm font-medium bg-black/30 hover:bg-black/50 px-6 py-3 rounded-full border border-white/10 backdrop-blur-md">
            <i class="ph-bold ph-arrow-left"></i> Voltar ao Painel Principal
        </a>
    </main>

    <!-- Modal de Listagem -->
    <div id="modalLista" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="fecharModalLista()"></div>
        <div class="bg-white w-full max-w-7xl rounded-3xl shadow-2xl relative z-10 flex flex-col max-h-[90vh] transform scale-95 transition-transform duration-300" id="modalContent">
            
            <div class="p-6 flex items-center justify-between border-b border-gray-100 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="bg-green-50 p-2 rounded-lg text-agro-600"><i class="ph-fill ph-users-three text-2xl"></i></div>
                    <div><h2 class="text-xl font-bold text-gray-800">Usuários Cadastrados</h2><p class="text-sm text-gray-500" id="statusBanco">Buscando...</p></div>
                </div>
                <button onclick="fecharModalLista()" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-xl"><i class="ph-bold ph-x text-xl"></i></button>
            </div>

            <div class="p-4 bg-gray-50 border-b border-gray-100 shrink-0">
                <div class="relative max-w-md">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="inputBuscaUsuario" onkeyup="filtrarUsuarios()" placeholder="Buscar por nome ou email..." class="w-full bg-white border border-gray-200 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-agro-500">
                </div>
            </div>

            <div class="overflow-auto flex-1 p-0">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead class="sticky top-0 bg-gray-50 shadow-sm z-10">
                        <tr class="text-gray-500 text-xs uppercase tracking-wider">
                            <th class="p-4 font-semibold border-b">Nome</th>
                            <th class="p-4 font-semibold border-b">Login / Email</th>
                            <th class="p-4 font-semibold border-b">Acessos Permitidos</th>
                            <th class="p-4 font-semibold border-b text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaUsuariosBody" class="text-gray-700 text-sm"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        let db = null; 
        let usuariosLocais = []; 
        let idUsuarioEmEdicao = null; 

        function inicializarFirebase() {
            const clustersSalvos = localStorage.getItem('agrofortis_firebase_clusters');
            if (clustersSalvos && JSON.parse(clustersSalvos).length > 0) {
                try { 
                    firebase.initializeApp(JSON.parse(clustersSalvos)[0]); 
                    db = firebase.firestore(); 
                } catch (error) {
                    console.error("Erro ao inicializar Firebase", error);
                }
            }
        }
        inicializarFirebase();

        window.cancelarEdicao = function() {
            document.getElementById('formUsuario').reset(); 
            idUsuarioEmEdicao = null;
            document.getElementById('tituloFormulario').innerText = "Novo Usuário"; 
            document.getElementById('subtituloFormulario').innerText = "Cadastre operadores e defina suas permissões de acesso."; 
            document.getElementById('btnSalvarTexto').innerText = "Salvar Usuário";
        }

        document.getElementById('btnSalvar').addEventListener('click', async () => {
            if (!db) return alert("Erro: Banco de dados não conectado.");
            
            const nome = document.getElementById('usrNome').value.trim(); 
            const email = document.getElementById('usrEmail').value.trim(); 
            const senha = document.getElementById('usrSenha').value; 

            // Permissões
            const permissoes = {
                usuarios: document.getElementById('permUsuarios').checked,
                clientes: document.getElementById('permClientes').checked,
                produtores: document.getElementById('permProdutores').checked,
                cargas: document.getElementById('permCargas').checked,
                descargas: document.getElementById('permDescargas').checked,
                inspecaoQC: document.getElementById('permInspecaoQC').checked,
                vendas: document.getElementById('permVendas').checked,
                relatorios: document.getElementById('permRelatorios').checked,
                backup: document.getElementById('permBackup').checked
            };

            if (!nome || !email) return alert("Por favor, preencha Nome e Login/Email.");
            if (!idUsuarioEmEdicao && !senha) return alert("Por favor, informe uma senha para novos usuários.");

            const btnTexto = document.getElementById('btnSalvarTexto'); 
            btnTexto.innerText = "Salvando...";

            const dadosUsuario = { nome, email, permissoes };
            if (senha) dadosUsuario.senha = senha; // Atualiza a senha apenas se foi digitada uma nova

            try {
                if (idUsuarioEmEdicao) {
                    await db.collection("usuarios").doc(idUsuarioEmEdicao).update(dadosUsuario);
                    alert("Usuário ATUALIZADO com sucesso!");
                } else {
                    dadosUsuario.dataCriacao = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection("usuarios").add(dadosUsuario);
                    alert("Usuário CRIADO com sucesso!");
                }
                cancelarEdicao(); 
            } catch (erro) { 
                alert("Erro ao salvar usuário: " + erro.message); 
            } finally { 
                btnTexto.innerText = idUsuarioEmEdicao ? "Atualizar Usuário" : "Salvar Usuário"; 
            }
        });

        window.carregarUsuariosDoBanco = async function() {
            const tbody = document.getElementById('listaUsuariosBody'); 
            const status = document.getElementById('statusBanco');
            if (!db) return;
            
            try {
                const snapshot = await db.collection("usuarios").orderBy("nome", "asc").get();
                tbody.innerHTML = ""; 
                usuariosLocais = [];
                status.innerText = "Atualizado";
                
                if(snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-gray-500">Nenhum usuário cadastrado.</td></tr>`;
                    return;
                }

                snapshot.forEach(doc => {
                    const usr = doc.data(); 
                    const id = doc.id; 
                    usuariosLocais.push({ id, ...usr });

                    // Montar badges de permissão visualmente
                    let badges = "";
                    if(usr.permissoes) {
                        if(usr.permissoes.usuarios) badges += `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-[10px] font-bold mr-1 mb-1 inline-block">Usuários (Admin)</span>`;
                        if(usr.permissoes.clientes) badges += `<span class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-[10px] font-bold mr-1 mb-1 inline-block">Clientes</span>`;
                        if(usr.permissoes.produtores) badges += `<span class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-[10px] font-bold mr-1 mb-1 inline-block">Produtores</span>`;
                        if(usr.permissoes.cargas) badges += `<span class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-[10px] font-bold mr-1 mb-1 inline-block">Cargas</span>`;
                        if(usr.permissoes.descargas) badges += `<span class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-[10px] font-bold mr-1 mb-1 inline-block">Descargas</span>`;
                        if(usr.permissoes.inspecaoQC) badges += `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-[10px] font-bold mr-1 mb-1 inline-block">Inspeção (QC)</span>`;
                        if(usr.permissoes.vendas) badges += `<span class="bg-teal-100 text-teal-700 px-2 py-1 rounded text-[10px] font-bold mr-1 mb-1 inline-block">Vendas</span>`;
                        if(usr.permissoes.relatorios) badges += `<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-[10px] font-bold mr-1 mb-1 inline-block">Relatórios</span>`;
                        if(usr.permissoes.backup) badges += `<span class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-[10px] font-bold mr-1 mb-1 inline-block">Segurança & Backup</span>`;
                    }
                    if(badges === "") badges = `<span class="text-gray-400 italic text-xs">Sem acessos configurados</span>`;

                    const tr = document.createElement('tr'); 
                    tr.className = "hover:bg-green-50/50 linha-usuario border-b border-gray-100";
                    tr.innerHTML = `
                        <td class="p-4 font-bold text-gray-800 flex items-center gap-2"><div class="bg-agro-100 p-1.5 rounded-full"><i class="ph-fill ph-user text-agro-600"></i></div> ${usr.nome}</td>
                        <td class="p-4 font-mono text-gray-600 text-xs">${usr.email}</td>
                        <td class="p-4 max-w-sm flex-wrap">${badges}</td>
                        <td class="p-4 text-center">
                            <button onclick="prepararEdicao('${id}')" title="Editar Usuário" class="text-blue-500 hover:bg-blue-50 p-2 rounded-md transition-colors"><i class="ph-bold ph-pencil-simple text-lg"></i></button>
                            <button onclick="deletarUsuario('${id}')" title="Excluir Usuário" class="text-red-500 hover:bg-red-50 p-2 rounded-md transition-colors"><i class="ph-bold ph-trash text-lg"></i></button>
                        </td>`;
                    tbody.appendChild(tr);
                });
            } catch (erro) {
                status.innerText = "Erro ao buscar";
            }
        }

        window.filtrarUsuarios = function() {
            const termo = document.getElementById('inputBuscaUsuario').value.toLowerCase();
            document.querySelectorAll('.linha-usuario').forEach(linha => { 
                linha.style.display = linha.innerText.toLowerCase().includes(termo) ? '' : 'none'; 
            });
        }

        window.prepararEdicao = function(id) {
            const usr = usuariosLocais.find(c => c.id === id);
            if (usr) {
                document.getElementById('usrNome').value = usr.nome || ''; 
                document.getElementById('usrEmail').value = usr.email || ''; 
                document.getElementById('usrSenha').value = ''; // Sempre vazio para edição segura
                
                // Marca os checkboxes conforme as permissões salvas
                if(usr.permissoes) {
                    document.getElementById('permUsuarios').checked = usr.permissoes.usuarios || false;
                    document.getElementById('permClientes').checked = usr.permissoes.clientes || false;
                    document.getElementById('permProdutores').checked = usr.permissoes.produtores || false;
                    document.getElementById('permCargas').checked = usr.permissoes.cargas || false;
                    document.getElementById('permDescargas').checked = usr.permissoes.descargas || false;
                    document.getElementById('permInspecaoQC').checked = usr.permissoes.inspecaoQC || false;
                    document.getElementById('permVendas').checked = usr.permissoes.vendas || false;
                    document.getElementById('permRelatorios').checked = usr.permissoes.relatorios || false;
                    document.getElementById('permBackup').checked = usr.permissoes.backup || false;
                } else {
                    document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
                }

                idUsuarioEmEdicao = id; 
                document.getElementById('tituloFormulario').innerText = "Editando Usuário"; 
                document.getElementById('btnSalvarTexto').innerText = "Atualizar Usuário";
                
                fecharModalLista(); 
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            }
        }

        window.deletarUsuario = async function(id) { 
            if(confirm("ATENÇÃO: Tem certeza que deseja excluir este usuário definitivamente? Ele não poderá mais aceder ao sistema.")) { 
                try {
                    await db.collection("usuarios").doc(id).delete(); 
                    carregarUsuariosDoBanco(); 
                } catch (e) {
                    alert("Erro ao excluir.");
                }
            } 
        }

        // Controle do Modal
        const modal = document.getElementById('modalLista'); 
        const modalContent = document.getElementById('modalContent');
        
        window.abrirModalLista = function() { 
            modal.classList.remove('hidden'); 
            setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); }, 10); 
            carregarUsuariosDoBanco(); 
        }
        
        window.fecharModalLista = function() { 
            modal.classList.add('opacity-0'); modalContent.classList.add('scale-95'); 
            setTimeout(() => modal.classList.add('hidden'), 300); 
        }
    </script>
</body>
</html>
