<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrofortis - Cadastro de Cliente</title>
    
    <!-- BLINDAGEM NUCLEAR PARA PÁGINAS PROTEGIDAS -->
    <script>
        function blindagemTotal() {
            const auth = localStorage.getItem('agrofortis_auth');
            const perms = JSON.parse(localStorage.getItem('agrofortis_user_perms') || '{}');
            
            if (auth !== 'true') {
                document.documentElement.style.display = 'none';
                window.location.replace('index.html');
            } else if (perms.clientes !== true) {
                document.documentElement.style.display = 'none';
                window.location.replace('sistema.html'); // Expulsa de volta pro painel
            }
        }
        blindagemTotal();
        setInterval(blindagemTotal, 500);

        window.history.pushState(null, null, window.location.href);
        window.addEventListener('popstate', function () {
            window.history.go(1);
        });
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { agro: { 500: '#16a34a', 600: '#15803d', 700: '#115e59' } } } }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center relative font-sans p-4">

    <div class="fixed inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449?q=80&w=1920&auto=format&fit=crop')] bg-cover bg-center">
        <div class="absolute inset-0 bg-green-950/90 backdrop-blur-sm"></div>
    </div>

    <main class="z-10 w-full max-w-3xl flex flex-col items-center">
        <div class="flex items-center gap-3 mb-6">
            <div class="bg-white/10 p-3 rounded-xl border border-white/20 shadow-lg backdrop-blur-md">
                <i class="ph-fill ph-plant text-4xl text-agro-500"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-wide text-white">Agro<span class="text-agro-500">fortis</span></h1>
        </div>

        <div class="bg-white w-full rounded-3xl shadow-2xl p-8 border border-gray-100 relative">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-gray-100 pb-5 mb-6 gap-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                        <i class="ph-fill ph-user-plus text-agro-500"></i> <span id="tituloFormulario">Novo Cliente</span>
                    </h2>
                    <p class="text-gray-500 text-sm mt-1" id="subtituloFormulario">Preencha os dados para cadastrar no sistema.</p>
                </div>
                <button onclick="abrirModalLista()" class="bg-gray-800 hover:bg-agro-600 text-white text-sm font-semibold py-2.5 px-4 rounded-xl flex items-center gap-2 shadow-md">
                    <i class="ph-bold ph-list-dashes text-agro-500"></i> Ver Cadastrados
                </button>
            </div>

            <form id="formCliente" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="md:col-span-2">
                    <label class="block text-gray-600 text-sm font-semibold mb-2">Nome Completo ou Razão Social</label>
                    <div class="relative">
                        <i class="ph ph-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                        <input type="text" id="cliNome" placeholder="Ex: Fazenda Boa Vista Ltda" class="w-full bg-gray-50 border border-gray-200 text-gray-700 rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-agro-500 font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-600 text-sm font-semibold mb-2">CPF ou CNPJ</label>
                    <div class="relative">
                        <i class="ph ph-identification-card absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                        <input type="text" id="cliCpf" placeholder="000.000.000-00" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-agro-500 font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-600 text-sm font-semibold mb-2">Inscrição Estadual (IE)</label>
                    <div class="relative">
                        <i class="ph ph-file-text absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                        <input type="text" id="cliIe" placeholder="Isento ou Número da IE" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-agro-500 font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-600 text-sm font-semibold mb-2">E-mail de Contato</label>
                    <div class="relative">
                        <i class="ph ph-envelope-simple absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                        <input type="email" id="cliEmail" placeholder="contato@empresa.com" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:border-agro-500 font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-600 text-sm font-semibold mb-2">Prazo de Pagamento (Dias)</label>
                    <div class="relative">
                        <i class="ph ph-calendar-blank absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                        <input type="number" id="cliPrazo" min="0" placeholder="Ex: 30" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-12 pr-14 py-3 focus:outline-none focus:border-agro-500 font-medium">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm font-bold">Dias</span>
                    </div>
                </div>
                <div class="md:col-span-2 flex flex-col-reverse sm:flex-row items-center justify-end gap-3 mt-4 pt-6 border-t border-gray-100">
                    <button type="button" onclick="cancelarEdicao()" class="w-full sm:w-auto text-gray-500 hover:text-gray-700 hover:bg-gray-100 font-semibold py-3 px-6 rounded-xl transition-colors">Cancelar / Limpar</button>
                    <button type="button" id="btnSalvar" class="w-full sm:w-auto bg-agro-600 hover:bg-agro-500 text-white font-bold py-3 px-8 rounded-xl flex items-center justify-center gap-2 shadow-lg">
                        <i class="ph-bold ph-check"></i> <span id="btnSalvarTexto">Salvar Cliente</span>
                    </button>
                </div>
            </form>
        </div>

        <a href="sistema.html" class="mt-6 text-white/80 hover:text-white flex items-center gap-2 text-sm font-medium bg-black/30 hover:bg-black/50 px-6 py-3 rounded-full border border-white/10 backdrop-blur-md">
            <i class="ph-bold ph-arrow-left"></i> Voltar ao Painel Principal
        </a>
    </main>

    <div id="modalLista" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="fecharModalLista()"></div>
        <div class="bg-white w-full max-w-6xl rounded-3xl shadow-2xl relative z-10 flex flex-col max-h-[90vh] transform scale-95 transition-transform duration-300" id="modalContent">
            
            <div class="p-6 flex items-center justify-between border-b border-gray-100 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="bg-green-50 p-2 rounded-lg text-agro-600"><i class="ph-fill ph-users text-2xl"></i></div>
                    <div><h2 class="text-xl font-bold text-gray-800">Clientes Cadastrados</h2><p class="text-sm text-gray-500" id="statusBanco">Buscando...</p></div>
                </div>
                <button onclick="fecharModalLista()" class="text-gray-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-xl"><i class="ph-bold ph-x text-xl"></i></button>
            </div>

            <div class="p-4 bg-gray-50 border-b border-gray-100 shrink-0">
                <div class="relative max-w-md">
                    <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="inputBuscaCliente" onkeyup="filtrarClientes()" placeholder="Buscar por nome, CPF ou CNPJ..." class="w-full bg-white border border-gray-200 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-agro-500">
                </div>
            </div>

            <div class="overflow-auto flex-1 p-0">
                <table class="w-full text-left border-collapse whitespace-nowrap">
                    <thead class="sticky top-0 bg-gray-50 shadow-sm z-10">
                        <tr class="text-gray-500 text-xs uppercase tracking-wider"><th class="p-4 font-semibold border-b">Nome / Razão Social</th><th class="p-4 font-semibold border-b">CPF / CNPJ</th><th class="p-4 font-semibold border-b">Inscrição Estadual</th><th class="p-4 font-semibold border-b">Prazo</th><th class="p-4 font-semibold border-b text-center">Ações</th></tr>
                    </thead>
                    <tbody id="listaClientesBody" class="text-gray-700 text-sm"></tbody>
                </table>
            </div>
            <div class="p-4 bg-gray-50 border-t flex justify-end shrink-0 rounded-b-3xl">
                <button onclick="carregarClientesDoBanco()" class="mr-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-5 rounded-lg flex items-center gap-2"><i class="ph-bold ph-arrows-clockwise"></i> Atualizar</button>
                <button onclick="fecharModalLista()" class="bg-gray-800 hover:bg-gray-700 text-white font-semibold py-2 px-5 rounded-lg">Fechar</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        let db = null; let clientesLocais = []; let idClienteEmEdicao = null; 

        function inicializarFirebase() {
            const clustersSalvos = localStorage.getItem('agrofortis_firebase_clusters');
            if (clustersSalvos && JSON.parse(clustersSalvos).length > 0) {
                try { firebase.initializeApp(JSON.parse(clustersSalvos)[0]); db = firebase.firestore(); } catch (error) {}
            }
        }
        inicializarFirebase();

        window.cancelarEdicao = function() {
            document.getElementById('formCliente').reset(); idClienteEmEdicao = null;
            document.getElementById('tituloFormulario').innerText = "Novo Cliente"; document.getElementById('subtituloFormulario').innerText = "Preencha os dados para cadastrar no sistema."; document.getElementById('btnSalvarTexto').innerText = "Salvar Cliente";
        }

        document.getElementById('btnSalvar').addEventListener('click', async () => {
            if (!db) return alert("Erro: Firebase não conectado.");
            const nome = document.getElementById('cliNome').value; const cpf = document.getElementById('cliCpf').value; const ie = document.getElementById('cliIe').value; const email = document.getElementById('cliEmail').value; const prazo = document.getElementById('cliPrazo').value; 

            if (!nome || !cpf) return alert("Por favor, preencha Nome e CPF.");

            const btnTexto = document.getElementById('btnSalvarTexto'); btnTexto.innerText = "Salvando...";
            const nomeUsuarioLogado = localStorage.getItem('agrofortis_user_name') || 'Admin';

            try {
                if (idClienteEmEdicao) {
                    await db.collection("clientes").doc(idClienteEmEdicao).update({ 
                        nome, cpfCnpj: cpf, inscricaoEstadual: ie || "Isento", email, prazo, 
                        modificadoPor: nomeUsuarioLogado 
                    });
                    alert("Cliente ATUALIZADO!");
                } else {
                    await db.collection("clientes").add({ 
                        nome, cpfCnpj: cpf, inscricaoEstadual: ie || "Isento", email, prazo, 
                        dataCriacao: firebase.firestore.FieldValue.serverTimestamp(),
                        registradoPor: nomeUsuarioLogado
                    });
                    alert("Cliente SALVO!");
                }
                cancelarEdicao(); 
            } catch (erro) { alert("Erro ao salvar."); } finally { btnTexto.innerText = idClienteEmEdicao ? "Atualizar Cliente" : "Salvar Cliente"; }
        });

        window.carregarClientesDoBanco = async function() {
            const tbody = document.getElementById('listaClientesBody'); const status = document.getElementById('statusBanco');
            if (!db) return;
            try {
                const snapshot = await db.collection("clientes").orderBy("dataCriacao", "desc").get();
                tbody.innerHTML = ""; clientesLocais = [];
                snapshot.forEach(doc => {
                    const cliente = doc.data(); const id = doc.id; clientesLocais.push({ id, ...cliente });
                    let textoPrazo = (cliente.prazo && cliente.prazo > 0) ? `${cliente.prazo} dias` : (cliente.prazo === "0" ? "À Vista" : "-");

                    const tr = document.createElement('tr'); tr.className = "hover:bg-green-50/50 linha-cliente";
                    tr.innerHTML = `<td class="p-4 font-bold text-gray-800">${cliente.nome}</td><td class="p-4 font-mono text-gray-600">${cliente.cpfCnpj}</td><td class="p-4 text-gray-600">${cliente.inscricaoEstadual}</td><td class="p-4"><span class="bg-green-100 text-green-700 font-bold px-3 py-1 rounded-full text-xs">${textoPrazo}</span></td><td class="p-4 text-center"><button onclick="prepararEdicao('${id}')" class="text-blue-500 p-2 rounded-md"><i class="ph-bold ph-pencil-simple text-lg"></i></button><button onclick="deletarCliente('${id}')" class="text-red-500 p-2 rounded-md"><i class="ph-bold ph-trash text-lg"></i></button></td>`;
                    tbody.appendChild(tr);
                });
            } catch (erro) {}
        }

        window.filtrarClientes = function() {
            const termo = document.getElementById('inputBuscaCliente').value.toLowerCase();
            document.querySelectorAll('.linha-cliente').forEach(linha => { linha.style.display = linha.innerText.toLowerCase().includes(termo) ? '' : 'none'; });
        }

        window.prepararEdicao = function(id) {
            const cliente = clientesLocais.find(c => c.id === id);
            if (cliente) {
                document.getElementById('cliNome').value = cliente.nome || ''; document.getElementById('cliCpf').value = cliente.cpfCnpj || ''; document.getElementById('cliIe').value = cliente.inscricaoEstadual || ''; document.getElementById('cliEmail').value = cliente.email || ''; document.getElementById('cliPrazo').value = cliente.prazo ? String(cliente.prazo).replace(/\D/g, '') : '';
                idClienteEmEdicao = id; document.getElementById('tituloFormulario').innerText = "Editando Cliente"; document.getElementById('btnSalvarTexto').innerText = "Atualizar Cliente";
                fecharModalLista(); window.scrollTo(0, 0); 
            }
        }

        window.deletarCliente = async function(id) { if(confirm("Excluir cliente?")) { await db.collection("clientes").doc(id).delete(); carregarClientesDoBanco(); } }

        const modal = document.getElementById('modalLista'); const modalContent = document.getElementById('modalContent');
        window.abrirModalLista = function() { modal.classList.remove('hidden'); setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); }, 10); carregarClientesDoBanco(); }
        window.fecharModalLista = function() { modal.classList.add('opacity-0'); modalContent.classList.add('scale-95'); setTimeout(() => modal.classList.add('hidden'), 300); }
    </script>
</body>
</html>
